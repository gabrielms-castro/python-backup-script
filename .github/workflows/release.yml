name: release

# Builds the PyInstaller binary and attaches it to the GitHub Release of a
# version tag. Runs when:
# - a tag is pushed: git tag v0.3.0 && git push origin v0.3.0
# - a release is published on the GitHub UI
# - started by hand (Actions > release > Run workflow) for an existing tag
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

env:
  ASSET_NAME: backup_v2-linux-x86_64
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

# Pushing a tag and publishing its release must not upload twice at once
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Debian bullseye ships glibc 2.31: the binary runs on servers with
    # glibc >= 2.31 (Debian 11+, Ubuntu 20.04+, RHEL 9+)
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install uv
        run: pip install --no-cache-dir "uv>=0.5,<1.0"

      - name: Check tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run task test

      - name: Build binary
        run: |
          uv run task build
          mv dist/backup_v2 "dist/$ASSET_NAME"
          ldd --version | head -1

      # Runs the binary until the S3 config check, before any dump or upload,
      # to make sure every module was bundled and the run is logged
      - name: Smoke test binary
        run: |
          smoke_dir=$(mktemp -d)
          mkdir -p "$smoke_dir/src" "$smoke_dir/logs"
          cd "$smoke_dir"
          set +e
          env ENVIRONMENT=prod SOURCE_PATH="$smoke_dir/src" LOGS_DIR="$smoke_dir/logs" \
            BACKUP_TARGETS=s3 "$GITHUB_WORKSPACE/dist/$ASSET_NAME"
          exit_code=$?
          set -e
          test "$exit_code" -eq 1
          grep -q '"event": *"run.finished"' "$smoke_dir"/logs/*.jsonl

      - name: Checksum
        run: |
          cd dist
          sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          cat "$ASSET_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binary

      - name: Publish assets on the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$ASSET_NAME" "$ASSET_NAME.sha256"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              "$ASSET_NAME" "$ASSET_NAME.sha256"
          fi
