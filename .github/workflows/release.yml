name: release

# Builds the PyInstaller binary and attaches it to the GitHub Release of a
# version tag. Runs when:
# - a tag is pushed: git tag v0.3.0 && git push origin v0.3.0
# - a release is published on the GitHub UI
# - started by hand (Actions > release > Run workflow) for an existing tag
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

env:
  ASSET_NAME: backup_v2-linux-x86_64
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

# Pushing a tag and publishing its release must not upload twice at once
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Debian bullseye ships glibc 2.31: the binary runs on servers with
    # glibc >= 2.31 (Debian 11+, Ubuntu 20.04+, RHEL 9+)
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install uv
        run: pip install --no-cache-dir "uv>=0.5,<1.0"

      - name: Check tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run task test

      - name: Build binary
        run: |
          uv run task build
          # the task's --name may change; dist/ holds only the binary
          test "$(ls dist | wc -l)" -eq 1
          mv dist/* "dist/$ASSET_NAME"
          ldd --version | head -1

      # Runs the binary until the S3 config check, before any dump or upload,
      # to make sure every module was bundled and the run is logged
      - name: Smoke test binary
        run: |
          smoke_dir=$(mktemp -d)
          mkdir -p "$smoke_dir/src" "$smoke_dir/logs"
          cd "$smoke_dir"
          set +e
          env ENVIRONMENT=prod SOURCE_PATH="$smoke_dir/src" LOGS_DIR="$smoke_dir/logs" \
            BACKUP_TARGETS=s3 "$GITHUB_WORKSPACE/dist/$ASSET_NAME"
          exit_code=$?
          set -e
          test "$exit_code" -eq 1
          grep -q '"event": *"run.finished"' "$smoke_dir"/logs/*.jsonl

      - name: Checksum
        run: |
          cd dist
          sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"
          cat "$ASSET_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binary

      # Install command shown at the top of the release page
      - name: Write install notes
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          cat > install.md <<EOF
          ## Instalação no servidor

          \`\`\`bash
          mkdir -p /opt/backup_script && cd /opt/backup_script
          curl -fsSLO "$base/$ASSET_NAME" -O "$base/$ASSET_NAME.sha256"
          sha256sum -c $ASSET_NAME.sha256
          mv $ASSET_NAME backup_v2 && chmod +x backup_v2
          \`\`\`

          Sempre a versão mais recente: troque \`download/$TAG\` por \`latest/download\`.
          Configure o \`.env\` em \`/opt/backup_script\` e rode com \`cd /opt/backup_script && ./backup_v2\`.

          EOF

      - name: Publish assets on the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$ASSET_NAME" "$ASSET_NAME.sha256"

            # Release created on the UI: put the install notes above its text
            body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if ! grep -q "Instalação no servidor" <<< "$body"; then
              printf '%s\n\n%s\n' "$(cat install.md)" "$body" > notes.md
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            # --generate-notes appends the changelog below install.md
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file install.md \
              --generate-notes \
              --verify-tag \
              "$ASSET_NAME" "$ASSET_NAME.sha256"
          fi
